<div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
    <div class="flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mx-auto mb-4">
        <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
    </div>
    
    <h3 class="text-lg leading-6 font-medium text-gray-900 text-center mb-4">
        API Key Created Successfully
    </h3>
    
    <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
        <p class="text-sm text-yellow-800 font-medium mb-2">⚠️ Save Your Key Now</p>
        <p class="text-sm text-yellow-700">This is the only time your API key will be displayed. Once you close this dialog, you won't be able to see it again.</p>
    </div>
    
    <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">API Key</label>
        <div class="flex items-center space-x-2">
            <input 
                type="text" 
                id="api-key-value" 
                value="{{ plaintext_key }}" 
                readonly
                class="flex-1 px-4 py-2 border border-gray-300 rounded-md font-mono text-sm bg-gray-50 focus:outline-none"
            />
            <button 
                type="button" 
                onclick="
                    const input = document.getElementById('api-key-value');
                    input.select();
                    document.execCommand('copy');
                    const toast = document.createElement('div');
                    toast.className = 'fixed top-4 right-4 bg-green-500 text-white px-4 py-3 rounded shadow-lg';
                    toast.textContent = 'API key copied to clipboard!';
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2000);
                "
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Copy
            </button>
        </div>
    </div>
    
    {% if api_key.expires_at %}
    <div class="mb-6 p-3 bg-blue-50 border border-blue-200 rounded">
        <p class="text-sm text-blue-800">
            <strong>Expires:</strong> {{ api_key.expires_at.strftime('%Y-%m-%d %H:%M UTC') }}
        </p>
    </div>
    {% endif %}
    
    <div class="bg-gray-50 px-4 py-3 sm:px-6 flex justify-center">
        <button 
            type="button" 
            onclick="const modal = document.getElementById('modal'); if (modal) modal.classList.add('hidden'); location.reload();"
            class="inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:text-sm">
            Done
        </button>
    </div>
</div>
