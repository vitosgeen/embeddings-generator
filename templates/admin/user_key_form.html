<div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">
        Create New API Key
    </h3>
    
    <p class="text-sm text-gray-600 mb-6">
        API keys are used to authenticate requests. Your key will be shown only once—save it immediately.
    </p>
    
    <form 
        hx-post="/admin/user/keys" 
        hx-target="#modal-content" 
        hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful) { const modal = document.getElementById('modal'); if (modal) modal.classList.add('hidden'); }">
        
        <div class="mb-4">
            <label for="label" class="block text-sm font-medium text-gray-700">Label (optional)</label>
            <input 
                type="text" 
                name="label" 
                id="label" 
                required
                placeholder="e.g., Production API Key, Testing Key"
                class="mt-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
            <p class="mt-1 text-xs text-gray-500">A descriptive name to help you identify this key later</p>
        </div>
        
        <div class="mb-4">
            <label for="expires_days" class="block text-sm font-medium text-gray-700">Expiration (optional)</label>
            <input 
                type="number" 
                name="expires_days" 
                id="expires_days"
                min="1"
                placeholder="Leave empty for no expiration"
                class="mt-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
            <p class="mt-1 text-xs text-gray-500">Number of days until key expires. Leave empty for indefinite access.</p>
        </div>
        
        <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
            <button 
                type="submit" 
                class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                Create Key
            </button>
            <button 
                type="button" 
                onclick="const modal = document.getElementById('modal'); if (modal) modal.classList.add('hidden');"
                class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                Cancel
            </button>
        </div>
    </form>
</div>
